# The Site Configuration
theme: jekyll-theme-chirpy

lang: en
timezone: Asia/Singapore

# SEO settings
title: Anupam Sinha
tagline: Architecture · Java · Spring · Cloud · AI
description: >-
  Practical guides and reference material for Java developers — architecture patterns,
  Spring Boot, collections, lambdas, cloud, and modern Java features.

url: "https://anupamsinha.github.io"
baseurl: ""

github:
  username: AnupamSinha

social:
  name: Anupam Sinha
  email: hianupamsinha@gmail.com
  links:
    - https://github.com/AnupamSinha
    - https://linkedin.com/in/anupam-sinha-42b29044

# Prefer color scheme
theme_mode: # empty = follow system, toggle available on sidebar

# Avatar on sidebar
avatar: https://avatars.githubusercontent.com/AnupamSinha

# TOC in posts
toc: true

# Comments
comments:
  provider: # leave empty for now

# Pagination
paginate: 10

# ------------ Do not modify below ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
