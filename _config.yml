# The Site Configuration
theme: jekyll-theme-chirpy

lang: en
timezone: Asia/Singapore

# SEO settings
title: Anupam Sinha
tagline: Architecture · Java · Spring · Cloud · AI
description: >-
  Java tutorials, Spring Boot guides, microservices patterns, and cloud-native development. 
  By a Technical Architect with 17 years of enterprise experience.

url: "https://anupamsinha.github.io"
baseurl: ""

github:
  username: AnupamSinha

social:
  name: Anupam Sinha
  email: hianupamsinha@gmail.com
  links:
    - https://github.com/AnupamSinha
    - https://linkedin.com/in/anupam-sinha-42b29044

# Web verification (add your codes when available)
webmaster_verifications:
  google: "Ewf3FLZmjBNwpE56M5zEINYQ65wcDHbPNlnTOHp5E8Q"
  bing: "5873A556A3600FD7D4371C2786867770"

# Prefer color scheme
theme_mode: # empty = follow system, toggle available on sidebar

# Avatar on sidebar
avatar: https://avatars.githubusercontent.com/AnupamSinha

# TOC in posts
toc: true

# Comments
comments:
  provider: giscus
  giscus:
    repo: AnupamSinha/anupamsinha.github.io
    repo_id: R_kgDOTzWXWQ
    category: General
    category_id: DIC_kwDOTzWXWc4DDEXd
    mapping: pathname
    strict: 0
    input_position: top
    lang: en
    reactions_enabled: 1

# Analytics
analytics:
  google:
    id: G-0GP5ZV7FCX
  goatcounter:
    id: anupamsinha

# Page views (displayed on posts)
pageviews:
  provider: goatcounter

# Pagination
paginate: 50

# ------------ Do not modify below ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
  - scope:
      path: ""
      type: tags
    values:
      sitemap: false
  - scope:
      path: ""
      type: categories
    values:
      sitemap: false

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
