name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 2

      - name: Submit changed URLs to IndexNow
        run: |
          SITE_URL="https://anupamsinha.github.io"
          KEY="a836b82a06fc4136b58b9ab921e7c697"

          # Get changed post files from the last commit
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD -- '_posts/*.md' 2>/dev/null || echo "")

          # Build URL list from changed posts
          URLS=""
          for file in $CHANGED_FILES; do
            # Extract slug from filename (remove date prefix and extension)
            slug=$(basename "$file" .md | sed 's/^[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-//')
            URLS="$URLS\"${SITE_URL}/posts/${slug}/\","
          done

          # Always include homepage
          URLS="\"${SITE_URL}/\",$URLS"

          # Remove trailing comma
          URLS=$(echo "$URLS" | sed 's/,$//')

          # Submit to IndexNow
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json" \
            -d "{
              \"host\": \"anupamsinha.github.io\",
              \"key\": \"${KEY}\",
              \"keyLocation\": \"${SITE_URL}/${KEY}.txt\",
              \"urlList\": [${URLS}]
            }"
          echo ""
          echo "Submitted to IndexNow: [${URLS}]"
